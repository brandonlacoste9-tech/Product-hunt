version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:14-alpine
    container_name: producthub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: producthub
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: producthub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U producthub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: producthub-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://producthub:changeme@db:5432/producthub"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "your-secret-key-here-change-in-production"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public

  # Redis (Optional - for caching and rate limiting)
  redis:
    image: redis:7-alpine
    container_name: producthub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
